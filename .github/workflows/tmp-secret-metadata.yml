  # TEMPORARY: identify the acceptance-test service account. Delete after use.
  name: tmp-secret-metadata
  on:
    pull_request:
  permissions:
    contents: read
  jobs:
    metadata:
      runs-on: ubuntu-latest
      timeout-minutes: 2
      steps:
        - env:
            MONDOO_CONFIG_BASE64: ${{ secrets.MONDOO_CONFIG_BASE64 }}
          run: echo "$MONDOO_CONFIG_BASE64" | base64 -d | jq '{api_endpoint, parent_mrn, mrn}'